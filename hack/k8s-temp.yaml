apiVersion: apps/v1
kind: Deployment
metadata:
    name: $NAME
    namespace: worker-addon
spec:
    # 先停旧 Pod，再起新镜像（避免与旧容器并行占 SGX/端口）；升级会有短暂中断
    strategy:
        type: Recreate
    selector:
        matchLabels:
            app: $NAME
    template:
        metadata:
            labels:
                app: $NAME
        spec:
            containers:
                - name: c0
                  image: $DSECRET_IMAGE
                  ports:
                      - containerPort: $SIDE_CHAIN_PORT
                        name: side
                        protocol: TCP
                      - containerPort: $GQL_PORT
                        name: qgl
                        protocol: TCP
                  env:
                      # ── 核心端口 & 环境 ──
                      - name: SIDE_CHAIN_PORT
                        value: "$SIDE_CHAIN_PORT"
                      - name: GQL_PORT
                        value: "$GQL_PORT"
                      - name: CHAIN_ENV
                        value: $CHAIN_ENV
                      # ── Auth / 密钥 ──
                      - name: JWT_SECRET
                        value: "$JWT_SECRET"
                      - name: SEED_SECRET
                        value: "$SEED_SECRET"
                      # ── 服务器配置 ──
                      - name: MOCK_EMAIL
                        value: "$MOCK_EMAIL"
                      - name: CORS_ORIGINS
                        value: "$CORS_ORIGINS"
                      # ── Google OAuth ──
                      - name: GOOGLE_CLIENT_ID
                        value: "$GOOGLE_CLIENT_ID"
                      - name: GOOGLE_CLIENT_SECRET
                        value: "$GOOGLE_CLIENT_SECRET"
                      - name: GOOGLE_REDIRECT_URL
                        value: "$GOOGLE_REDIRECT_URL"
                      # ── GitHub OAuth (optional) ──
                      - name: GITHUB_CLIENT_ID
                        value: "$GITHUB_CLIENT_ID"
                      - name: GITHUB_CLIENT_SECRET
                        value: "$GITHUB_CLIENT_SECRET"
                      - name: GITHUB_REDIRECT_URL
                        value: "$GITHUB_REDIRECT_URL"
                      # ── X/Twitter OAuth (optional) ──
                      - name: TWITTER_CLIENT_ID
                        value: "$TWITTER_CLIENT_ID"
                      - name: TWITTER_CLIENT_SECRET
                        value: "$TWITTER_CLIENT_SECRET"
                      - name: TWITTER_REDIRECT_URL
                        value: "$TWITTER_REDIRECT_URL"
                      # ── SMTP (email OTP) ──
                      - name: SMTP_HOST
                        value: "$SMTP_HOST"
                      - name: SMTP_PORT
                        value: "$SMTP_PORT"
                      - name: SMTP_USER
                        value: "$SMTP_USER"
                      - name: SMTP_PASSWORD
                        value: "$SMTP_PASSWORD"
                      - name: SMTP_FROM
                        value: "$SMTP_FROM"
                      - name: SMTP_FROM_NAME
                        value: "$SMTP_FROM_NAME"
                  volumeMounts:
                      - name: $NAME
                        mountPath: /token_chain_data
                  resources:
                      limits:
                          alibabacloud.com/sgx_epc_MiB: 10
                      requests:
                          alibabacloud.com/sgx_epc_MiB: 10
            volumes:
                - name: $NAME
                  hostPath:
                      type: DirectoryOrCreate
                      path: $DSECRET_DIR
            nodeSelector:
                TEE: "SGX"

---
apiVersion: v1
kind: Service
metadata:
    name: $NAME-service
    namespace: worker-addon
spec:
    type: NodePort
    selector:
        app: $NAME
    ports:
        - name: side
          protocol: TCP
          nodePort: $SIDE_CHAIN_PORT
          port: $SIDE_CHAIN_PORT
          targetPort: $SIDE_CHAIN_PORT
        - name: side-rpc
          protocol: TCP
          nodePort: $SIDE_CHAIN_RPC_PORT
          port: $SIDE_CHAIN_RPC_PORT
          targetPort: $SIDE_CHAIN_RPC_PORT
        - name: qgl
          protocol: TCP
          nodePort: $GQL_PORT
          port: $GQL_PORT
          targetPort: $GQL_PORT
